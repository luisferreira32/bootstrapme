name: go ci
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/go.yml' # trigger itself
      - '**.go'
      - 'go.mod'
      - 'go.sum'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go dependencies
        run: go mod download
      - name: Test Go code
        run: go test ./...
      - name: Lint Go code
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # 9.2.1
        with:
          version: v2.12
